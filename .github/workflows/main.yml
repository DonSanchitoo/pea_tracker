name: PEA Tracker

# Soir (jours de bourse) : cours de clôture -> dashboard.
#   17h30 UTC = 18h30 à Paris l'hiver, 19h30 l'été.
# Matin (lundi-vendredi) : plans exécutés la veille + mails.
#   Mail hebdo le lundi, mail « plans exécutés » le jour ouvré qui suit l'exécution du 16.
#   5h15 UTC = 6h15 à Paris l'hiver, 7h15 l'été.
# GitHub peut décaler les tâches planifiées de 15 à 60 minutes.
on:
  schedule:
    - cron: '30 17 * * 1-5'
    - cron: '15 5 * * 1-5'
  workflow_dispatch:
    inputs:
      mail:
        description: "Mail à envoyer"
        type: choice
        options: [none, auto, weekly, dca, weekly+dca]
        default: none

concurrency:
  group: pea-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Mise à jour (cours, plans, dashboard, mail)
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          MAIL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mail || (github.event.schedule == '15 5 * * 1-5' && 'auto' || 'none') }}
        run: python pea_tracker.py --mail "$MAIL_MODE"

      - name: Enregistrer les données
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune donnée modifiée."
          else
            git commit -m "Mise à jour des données [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
